# Spring Application Name
spring.application.name=airsense-backend

# MySQL Database Configuration (Aiven Cloud default with local/cloud override support)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:mysql://mysql-31858198-avverma7620-82ac.d.aivencloud.com:27112/airsense_db?sslMode=REQUIRED&useSSL=true&allowPublicKeyRetrieval=true&autoReconnect=true}}
